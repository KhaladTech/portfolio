<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Khalad — Cybersecurity Portfolio</title><meta name="description" content="Khalad's cybersecurity portfolio: DFIR investigations, SOC labs, security projects and hands-on research.">
<style>
:root{--bg:#0b0f14;--panel:#111821;--line:#24303d;--text:#edf2f7;--muted:#94a3b8;--accent:#58d6a9;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.6}a{color:inherit;text-decoration:none}.wrap{max-width:1100px;margin:auto;padding:0 24px}.nav{position:sticky;top:0;z-index:10;background:#0b0f14e8;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}.navin{max-width:1100px;margin:auto;padding:15px 24px;display:flex;justify-content:space-between;gap:20px;align-items:center}.brand{font-family:var(--mono);font-weight:700}.brand span{color:var(--accent)}nav{display:flex;gap:18px;flex-wrap:wrap}nav a{font:12px var(--mono);color:var(--muted)}nav a:hover{color:var(--accent)}.hero{padding:100px 0 75px}.eyebrow,.type{font:12px var(--mono);color:var(--accent);text-transform:uppercase;letter-spacing:.08em}.hero h1{font-size:clamp(42px,7vw,78px);line-height:1.02;max-width:850px;margin:16px 0 24px}.hero p{max-width:720px;color:var(--muted);font-size:18px}.pills,.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}.pill,.tag{font:11px var(--mono);border:1px solid var(--line);padding:6px 9px;color:var(--muted);border-radius:5px}section{padding:65px 0;border-top:1px solid var(--line)}.sectionhead{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}.sectionhead h2{font-size:30px;margin:0}.sectionhead p{margin:0;color:var(--muted);font:12px var(--mono)}.about{max-width:760px;color:var(--muted)}.certs{display:flex;flex-wrap:wrap;gap:10px;margin-top:25px}.cert{padding:10px 13px;border:1px solid var(--line);background:var(--panel);font:12px var(--mono)}.cert b{color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:var(--panel);border:1px solid var(--line);padding:24px;border-radius:8px;transition:.18s}.card:hover{border-color:#3f5b66;transform:translateY(-2px)}.card h3{margin:7px 0 10px;font-size:19px}.card p{color:var(--muted);margin:0}.investigation{padding:22px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:80px 1fr;gap:22px}.investigation:first-child{border-top:0}.year{font:12px var(--mono);color:var(--accent)}.investigation h3{margin:0 0 7px}.investigation p{color:var(--muted);margin:0}.skills{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.skill{border:1px solid var(--line);padding:20px}.skill h3{font:12px var(--mono);color:var(--accent);text-transform:uppercase}.skill ul{padding-left:18px;color:var(--muted)}.achievement{border-left:2px solid var(--accent);padding:4px 0 4px 18px;margin:22px 0}.achievement h3{margin:0 0 4px}.achievement p{margin:0;color:var(--muted)}.contact a{display:inline-block;border:1px solid var(--line);padding:10px 15px;margin:6px 8px 0 0;font:12px var(--mono)}footer{border-top:1px solid var(--line);padding:30px 0 50px;color:var(--muted);font:11px var(--mono)}@media(max-width:700px){nav{display:none}.grid,.skills{grid-template-columns:1fr}.hero{padding-top:70px}.investigation{grid-template-columns:1fr}.sectionhead{align-items:start;flex-direction:column}}
</style></head><body>
<div class="nav"><div class="navin"><div class="brand">KHALAD<span>//SEC</span></div><nav><a href="#projects">Projects</a><a href="#labs">Labs</a><a href="#investigations">Investigations</a><a href="#skills">Skills</a><a href="#achievements">Achievements</a><a href="#contact">Contact</a></nav></div></div>
<main class="wrap" id="app">Loading portfolio…</main>
<script>
const esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};const tags=a=>`<div class="tags">${(a||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>`;
async function render(){let d;try{d=await(await fetch('./data.json',{cache:'no-store'})).json()}catch(e){document.querySelector('#app').innerHTML='Could not load portfolio data.';return}const cards=(arr)=>`<div class="grid">${(arr||[]).map(x=>`<article class="card"><span class="type">${esc(x.type||'')}</span><h3>${esc(x.title)}</h3><p>${esc(x.description)}</p>${tags(x.tags)}</article>`).join('')}</div>`;const h=d.hero||{},a=d.about||{};document.querySelector('#app').innerHTML=`
<header class="hero"><span class="eyebrow">${esc(h.tag)}</span><h1>${esc(h.headline)}</h1><p>${esc(h.lede)}</p><div class="pills">${(h.pills||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div></header>
<section id="about"><div class="sectionhead"><h2>About</h2><p>01 / PROFILE</p></div><div class="about">${(a.paragraphs||[]).map(x=>`<p>${esc(x)}</p>`).join('')}</div><div class="certs">${(a.certifications||[]).map(x=>`<span class="cert"><b>${esc(x.code)}</b> · ${esc(x.name)}</span>`).join('')}</div></section>
<section id="projects"><div class="sectionhead"><h2>Projects</h2><p>02 / THINGS I'VE BUILT</p></div>${cards(d.projects)}</section>
<section id="labs"><div class="sectionhead"><h2>Labs</h2><p>03 / HANDS-ON PRACTICE</p></div>${cards(d.labs)}</section>
<section id="investigations"><div class="sectionhead"><h2>Investigations</h2><p>04 / CASE WORK</p></div>${(d.investigations||[]).map(x=>`<article class="investigation"><div class="year">${esc(x.year)}</div><div><h3>${esc(x.title)}</h3><p>${esc(x.description)}</p>${tags(x.tags)}</div></article>`).join('')}</section>
<section id="skills"><div class="sectionhead"><h2>Skills & Tools</h2><p>05 / TOOLKIT</p></div><div class="skills">${(d.skills||[]).map(x=>`<div class="skill"><h3>${esc(x.group)}</h3><ul>${(x.items||[]).map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`).join('')}</div></section>
<section id="achievements"><div class="sectionhead"><h2>Achievements</h2><p>06 / MILESTONES</p></div>${(d.achievements||[]).map(x=>`<div class="achievement"><h3>${esc(x.title)}</h3><p>${esc(x.description)}</p></div>`).join('')}</section>
<section id="contact" class="contact"><div class="sectionhead"><h2>Contact</h2><p>07 / CONNECT</p></div><p class="about">${esc(d.contact?.blurb)}</p>${(d.contact?.links||[]).map(x=>`<a href="${esc(x.url)}">${esc(x.label)} ↗</a>`).join('')}</section>`}
render();
</script><footer><div class="wrap">© 2026 Khalad · Cybersecurity Portfolio</div></footer></body></html>
