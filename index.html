<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Khalad — Cybersecurity Portfolio</title><meta name="description" content="Khalad's cybersecurity portfolio: DFIR, SOC, projects, labs, investigations and technical write-ups.">
<style>
:root{--bg:#090d12;--panel:#10171f;--panel2:#0d131a;--line:#24313d;--text:#edf3f7;--muted:#91a0af;--accent:#58d6a9;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.65}a{color:inherit;text-decoration:none}.wrap{max-width:1120px;margin:auto;padding:0 24px}.nav{position:sticky;top:0;z-index:20;background:#090d12e8;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.navin{max-width:1120px;margin:auto;padding:15px 24px;display:flex;justify-content:space-between;gap:24px;align-items:center}.brand{font:700 14px var(--mono)}.brand span{color:var(--accent)}nav{display:flex;gap:20px;flex-wrap:wrap}nav a{font:12px var(--mono);color:var(--muted)}nav a:hover{color:var(--accent)}.hero{padding:110px 0 90px}.eyebrow,.type{font:12px var(--mono);color:var(--accent);text-transform:uppercase;letter-spacing:.09em}.hero h1{font-size:clamp(46px,7vw,82px);line-height:1.01;max-width:900px;margin:16px 0 25px;letter-spacing:-.04em}.hero>p{max-width:760px;color:var(--muted);font-size:18px}.pills,.tags,.filters{display:flex;gap:8px;flex-wrap:wrap}.pills{margin-top:25px}.pill,.tag{font:11px var(--mono);border:1px solid var(--line);padding:6px 9px;color:var(--muted);border-radius:5px}section{padding:70px 0;border-top:1px solid var(--line)}.sectionhead{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}.sectionhead h2{font-size:32px;margin:0}.sectionhead p{margin:0;color:var(--muted);font:12px var(--mono)}.filters{margin-bottom:25px}.filter{cursor:pointer;background:transparent;color:var(--muted);border:1px solid var(--line);padding:8px 12px;border-radius:5px;font:11px var(--mono)}.filter:hover,.filter.active{border-color:var(--accent);color:var(--accent);background:#58d6a90b}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);padding:25px;border-radius:9px;transition:.18s;min-height:255px}.card:hover{border-color:#45616b;transform:translateY(-3px)}.card h3{margin:8px 0 10px;font-size:20px}.card p{color:var(--muted);margin:0 0 18px}.card .tags{margin-top:auto}.open{margin-top:20px;color:var(--accent);font:12px var(--mono)}.empty{color:var(--muted);border:1px dashed var(--line);padding:24px;border-radius:8px}.about{max-width:800px;color:var(--muted)}.certs{display:flex;flex-wrap:wrap;gap:10px;margin-top:25px}.cert{padding:10px 13px;border:1px solid var(--line);background:var(--panel);font:12px var(--mono)}.cert b{color:var(--accent)}.skills{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.skill{border:1px solid var(--line);padding:20px;background:var(--panel2)}.skill h3{font:12px var(--mono);color:var(--accent);text-transform:uppercase}.skill ul{padding-left:18px;color:var(--muted)}.achievement{border-left:2px solid var(--accent);padding:5px 0 5px 18px;margin:23px 0}.achievement h3{margin:0 0 4px}.achievement p{margin:0;color:var(--muted)}.contact a{display:inline-block;border:1px solid var(--line);padding:10px 15px;margin:7px 8px 0 0;font:12px var(--mono)}footer{border-top:1px solid var(--line);padding:30px 0 50px;color:var(--muted);font:11px var(--mono)}@media(max-width:700px){nav{display:none}.grid,.skills{grid-template-columns:1fr}.hero{padding:75px 0 60px}.sectionhead{align-items:start;flex-direction:column}}
</style></head><body>
<div class="nav"><div class="navin"><a class="brand" href="./">KHALAD<span>//SEC</span></a><nav><a href="#work">Work</a><a href="#skills">Skills</a><a href="#achievements">Achievements</a><a href="#about">About</a><a href="#contact">Contact</a></nav></div></div>
<main class="wrap" id="app">Loading portfolio…</main><footer id="footer"></footer>
<script>
const esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};
const slug=s=>(s||'work').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const tags=a=>`<div class="tags">${(a||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>`;
let works=[];
function renderWorks(filter='all'){document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));const shown=filter==='all'?works:works.filter(x=>x.kind===filter);document.querySelector('#workGrid').innerHTML=shown.length?shown.map(x=>`<a class="card" href="work.html?id=${encodeURIComponent(x.item.id||slug(x.item.title))}"><span class="type">${esc(x.label)}${x.item.type?' · '+esc(x.item.type):''}</span><h3>${esc(x.item.title)}</h3><p>${esc(x.item.description||'')}</p>${tags(x.item.tags)}<span class="open">${x.kind==='writeups'?'Read Write-up':'View Details'} →</span></a>`).join(''):'<div class="empty">No work published in this category yet.</div>'}
async function render(){let d;try{const r=await fetch('./data.json?'+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();d=await r.json()}catch(e){document.querySelector('#app').innerHTML='<p>Could not load portfolio data.</p>';return}
const groups=[['projects','Project'],['writeups','Write-up'],['labs','Lab'],['investigations','Investigation']];works=groups.flatMap(([kind,label])=>(d[kind]||[]).map(item=>({kind,label,item})));
const h=d.hero||{},a=d.about||{};document.querySelector('#app').innerHTML=`<header class="hero"><span class="eyebrow">${esc(h.tag)}</span><h1>${esc(h.headline)}</h1><p>${esc(h.lede)}</p><div class="pills">${(h.pills||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div></header>
<section id="work"><div class="sectionhead"><h2>Selected Work</h2><p>PROJECTS · WRITE-UPS · LABS · CASES</p></div><div class="filters">${[['all','All'],...groups].map(([k,l])=>`<button class="filter${k==='all'?' active':''}" data-filter="${k}">${l}</button>`).join('')}</div><div class="grid" id="workGrid"></div></section>
<section id="skills"><div class="sectionhead"><h2>Skills & Tools</h2><p>TOOLKIT</p></div><div class="skills">${(d.skills||[]).map(x=>`<div class="skill"><h3>${esc(x.group)}</h3><ul>${(x.items||[]).map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`).join('')}</div></section>
<section id="achievements"><div class="sectionhead"><h2>Certifications & Achievements</h2><p>MILESTONES</p></div><div class="certs">${(a.certifications||[]).map(x=>`<span class="cert"><b>${esc(x.code)}</b> · ${esc(x.name)}</span>`).join('')}</div>${(d.achievements||[]).map(x=>`<div class="achievement"><h3>${esc(x.title)}</h3><p>${esc(x.description)}</p></div>`).join('')}</section>
<section id="about"><div class="sectionhead"><h2>About</h2><p>PROFILE</p></div><div class="about">${(a.paragraphs||[]).map(x=>`<p>${esc(x)}</p>`).join('')}</div></section>
<section id="contact" class="contact"><div class="sectionhead"><h2>Contact</h2><p>CONNECT</p></div><p class="about">${esc(d.contact?.blurb)}</p>${(d.contact?.links||[]).map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.label)} ↗</a>`).join('')}</section>`;
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>renderWorks(b.dataset.filter));renderWorks();const f=d.footer||{};document.querySelector('#footer').innerHTML=`<div class="wrap">© ${new Date().getFullYear()} ${esc(f.name||'Khalad')} · ${esc(f.note||'Cybersecurity Portfolio')}</div>`}
render();
</script></body></html>
