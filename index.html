<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khalad — Digital Forensics & Incident Response</title>
<meta name="description" content="Khalad — DFIR specialist. Case work in registry, MFT/USN Journal, malware triage, and intrusion reconstruction.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12151a;
    --bg-alt: #0e1014;
    --panel: #181c24;
    --panel-border: #2a2f3a;
    --text: #e9e6df;
    --text-dim: #8a93a3;
    --text-faint: #545c6a;
    --accent: #c98a3a;
    --accent-dim: #8f6530;
    --serif: "Source Serif 4", Georgia, serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin:0; background: var(--bg); color: var(--text);
    font-family: var(--serif); line-height: 1.6; -webkit-font-smoothing: antialiased;
  }
  ::selection{ background: var(--accent-dim); color: var(--text); }
  a{ color: var(--accent); text-decoration: none; }
  a:hover{ text-decoration: underline; }
  a:focus-visible, button:focus-visible{ outline: 2px solid var(--accent); outline-offset: 3px; }
  .wrap{ max-width: 760px; margin: 0 auto; padding: 0 28px; }

  .topbar{ position: sticky; top: 0; z-index: 10; background: rgba(18,21,26,0.9); backdrop-filter: blur(6px); border-bottom: 1px solid var(--panel-border); }
  .topbar-inner{ max-width: 760px; margin: 0 auto; padding: 14px 28px; display: flex; justify-content: space-between; align-items: center; font-family: var(--mono); font-size: 12.5px; }
  .topbar-id{ color: var(--text-dim); letter-spacing: 0.02em; }
  .topbar-nav{ display: flex; gap: 18px; }
  .topbar-nav a{ color: var(--text-dim); }
  .topbar-nav a:hover{ color: var(--accent); text-decoration: none; }

  .hero{ padding: 72px 0 56px; border-bottom: 1px solid var(--panel-border); }
  .hero-tag{ display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12px; color: var(--accent); border: 1px solid var(--accent-dim); padding: 4px 10px; border-radius: 3px; margin-bottom: 28px; }
  .hero-tag::before{ content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .hero h1{ font-size: clamp(34px, 5.5vw, 50px); line-height: 1.12; margin: 0 0 18px; font-weight: 600; max-width: 11ch; }
  .hero p.lede{ font-size: 18px; color: var(--text-dim); max-width: 52ch; margin: 0 0 30px; }
  .hero-meta{ display: flex; flex-wrap: wrap; gap: 10px; font-family: var(--mono); font-size: 12.5px; }
  .pill{ color: var(--text-dim); border: 1px solid var(--panel-border); padding: 5px 10px; border-radius: 3px; }

  section{ padding: 56px 0; border-bottom: 1px solid var(--panel-border); }
  section:last-of-type{ border-bottom: none; }
  .section-head{ display: flex; align-items: baseline; gap: 12px; margin-bottom: 28px; }
  .section-num{ font-family: var(--mono); font-size: 12px; color: var(--text-faint); }
  .section-head h2{ font-size: 22px; font-weight: 600; margin: 0; }

  .about p{ color: var(--text-dim); max-width: 62ch; }
  .about p + p{ margin-top: 14px; }
  .cert-row{ margin-top: 26px; display: flex; flex-wrap: wrap; gap: 10px; }
  .cert{ font-family: var(--mono); font-size: 12.5px; color: var(--text); background: var(--panel); border: 1px solid var(--panel-border); border-left: 2px solid var(--accent); padding: 8px 12px; }
  .cert b{ color: var(--accent); font-weight: 600; }

  .project{ background: var(--panel); border: 1px solid var(--panel-border); padding: 26px 26px 24px; }
  .project-head{ display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 10px; }
  .project-head h3{ font-size: 19px; margin: 0; font-weight: 600; }
  .project-tag{ font-family: var(--mono); font-size: 11px; color: var(--accent); border: 1px solid var(--accent-dim); padding: 3px 8px; border-radius: 3px; white-space: nowrap; }
  .project p{ color: var(--text-dim); max-width: 60ch; }
  .project p + p{ margin-top: 12px; }
  .stack{ margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; }
  .stack span{ font-family: var(--mono); font-size: 11.5px; color: var(--text-dim); border: 1px solid var(--panel-border); padding: 4px 9px; border-radius: 3px; }

  .case{ display: grid; grid-template-columns: 84px 1fr; gap: 20px; padding: 22px 0; border-top: 1px solid var(--panel-border); }
  .case:first-of-type{ border-top: none; padding-top: 0; }
  .case-id{ font-family: var(--mono); font-size: 12px; color: var(--text-faint); padding-top: 3px; }
  .case-id .n{ display:block; color: var(--accent); font-size: 15px; margin-bottom: 4px; }
  .case-body h3{ font-size: 16.5px; margin: 0 0 8px; font-weight: 600; }
  .case-body p{ color: var(--text-dim); margin: 0 0 12px; max-width: 58ch; }
  .case-artifacts{ display: flex; flex-wrap: wrap; gap: 7px; }
  .case-artifacts span{ font-family: var(--mono); font-size: 11px; color: var(--text-dim); background: var(--bg-alt); border: 1px solid var(--panel-border); padding: 3px 8px; border-radius: 3px; }

  .skills-grid{ display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px 32px; }
  .skill-group h4{ font-family: var(--mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint); margin: 0 0 10px; font-weight: 500; }
  .skill-group ul{ list-style: none; margin: 0; padding: 0; color: var(--text-dim); font-size: 14.5px; }
  .skill-group li{ padding: 5px 0; border-top: 1px solid var(--panel-border); }
  .skill-group li:first-child{ border-top: none; }

  .contact h2{ font-size: 26px; margin: 0 0 14px; font-weight: 600; }
  .contact p{ color: var(--text-dim); max-width: 50ch; margin-bottom: 28px; }
  .contact-links{ display: flex; flex-wrap: wrap; gap: 14px; }
  .contact-links a{ font-family: var(--mono); font-size: 13.5px; color: var(--text); border: 1px solid var(--panel-border); padding: 10px 16px; border-radius: 3px; transition: border-color .15s ease, color .15s ease; }
  .contact-links a:hover{ border-color: var(--accent); color: var(--accent); text-decoration: none; }

  footer{ padding: 28px 0 60px; font-family: var(--mono); font-size: 11.5px; color: var(--text-faint); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }

  .skeleton{ color: var(--text-faint); font-family: var(--mono); font-size: 13px; }

  @media (max-width: 560px){
    .case{ grid-template-columns: 1fr; }
    .case-id{ display: flex; align-items: baseline; gap: 8px; padding-top: 0; }
    .skills-grid{ grid-template-columns: 1fr; }
    .topbar-nav{ gap: 12px; }
  }
  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior: auto; }
    .contact-links a{ transition: none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <span class="topbar-id">KHALAD // DFIR</span>
    <nav class="topbar-nav">
      <a href="#about">About</a>
      <a href="#project">Project</a>
      <a href="#cases">Case log</a>
      <a href="#skills">Skills</a>
      <a href="#contact">Contact</a>
    </nav>
  </div>
</div>

<div class="wrap" id="app">
  <p class="skeleton" style="padding-top:80px;">Loading…</p>
</div>

<script>
function esc(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

async function render(){
  const app = document.getElementById('app');
  let data;
  try{
    const res = await fetch('./data.json', { cache: 'no-store' });
    data = await res.json();
  }catch(e){
    app.innerHTML = '<p class="skeleton" style="padding-top:80px;">Could not load data.json — check the file is present and valid.</p>';
    return;
  }

  const hero = data.hero || {};
  const about = data.about || {};
  const project = data.project || {};
  const cases = data.cases || [];
  const skills = data.skills || [];
  const contact = data.contact || {};
  const footer = data.footer || {};

  const pillsHtml = (hero.pills || []).map(p => `<span class="pill">${esc(p)}</span>`).join('');

  const certsHtml = (about.certifications || []).map(c =>
    `<span class="cert"><b>${esc(c.code)}</b> — ${esc(c.name)}</span>`
  ).join('');

  const aboutParasHtml = (about.paragraphs || []).map(p => `<p>${esc(p)}</p>`).join('');

  const projectParasHtml = (project.paragraphs || []).map(p => `<p>${esc(p)}</p>`).join('');
  const stackHtml = (project.stack || []).map(s => `<span>${esc(s)}</span>`).join('');

  const casesHtml = cases.map((c, i) => {
    const num = String(cases.length - i).padStart(2, '0');
    const artifactsHtml = (c.artifacts || []).map(a => `<span>${esc(a)}</span>`).join('');
    return `
    <div class="case">
      <div class="case-id"><span class="n">${esc(num)}</span>${esc(c.year || '')}</div>
      <div class="case-body">
        <h3>${esc(c.title)}</h3>
        <p>${esc(c.description)}</p>
        <div class="case-artifacts">${artifactsHtml}</div>
      </div>
    </div>`;
  }).join('');

  const skillsHtml = skills.map(g => `
    <div class="skill-group">
      <h4>${esc(g.group)}</h4>
      <ul>${(g.items || []).map(i => `<li>${esc(i)}</li>`).join('')}</ul>
    </div>
  `).join('');

  const linksHtml = (contact.links || []).map(l => `<a href="${esc(l.url)}">${esc(l.label)}</a>`).join('');

  app.innerHTML = `
    <header class="hero">
      <span class="hero-tag">${esc(hero.tag || '')}</span>
      <h1>${esc(hero.headline || '')}</h1>
      <p class="lede">${esc(hero.lede || '')}</p>
      <div class="hero-meta">${pillsHtml}</div>
    </header>

    <section id="about" class="about">
      <div class="section-head"><span class="section-num">01</span><h2>About</h2></div>
      ${aboutParasHtml}
      <div class="cert-row">${certsHtml}</div>
    </section>

    <section id="project">
      <div class="section-head"><span class="section-num">02</span><h2>Featured project</h2></div>
      <div class="project">
        <div class="project-head">
          <h3>${esc(project.title || '')}</h3>
          <span class="project-tag">${esc(project.tag || '')}</span>
        </div>
        ${projectParasHtml}
        <div class="stack">${stackHtml}</div>
      </div>
    </section>

    <section id="cases">
      <div class="section-head"><span class="section-num">03</span><h2>Case log</h2></div>
      ${casesHtml}
    </section>

    <section id="skills">
      <div class="section-head"><span class="section-num">04</span><h2>Skills</h2></div>
      <div class="skills-grid">${skillsHtml}</div>
    </section>

    <section id="contact" class="contact">
      <div class="section-head"><span class="section-num">05</span><h2>Contact</h2></div>
      <p>${esc(contact.blurb || '')}</p>
      <div class="contact-links">${linksHtml}</div>
    </section>

    <footer>
      <span>&copy; 2026 ${esc(footer.name || '')}</span>
      <span>${esc(footer.note || '')}</span>
    </footer>
  `;
}

render();
</script>
</body>
</html>
