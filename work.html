<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Work — Khalad</title><style>:root{--bg:#090d12;--panel:#10171f;--line:#24313d;--text:#edf3f7;--muted:#91a0af;--accent:#58d6a9;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.75}.wrap{max-width:900px;margin:auto;padding:0 24px}a{color:inherit;text-decoration:none}.nav{border-bottom:1px solid var(--line);position:sticky;top:0;background:#090d12ed;backdrop-filter:blur(10px)}.navin{max-width:900px;margin:auto;padding:16px 24px;display:flex;justify-content:space-between;font:12px var(--mono)}.nav a{color:var(--muted)}.nav a:hover{color:var(--accent)}main{padding:80px 24px 100px}.type{font:12px var(--mono);color:var(--accent);text-transform:uppercase;letter-spacing:.08em}h1{font-size:clamp(38px,6vw,65px);line-height:1.05;letter-spacing:-.035em;margin:15px 0 22px}.lede{font-size:18px;color:var(--muted);max-width:760px}.meta,.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:25px}.tag,.meta span{font:11px var(--mono);border:1px solid var(--line);padding:6px 9px;color:var(--muted);border-radius:5px}.writeup{border-top:1px solid var(--line);margin-top:55px;padding-top:45px}.writeup h2{font-size:25px;margin-top:36px}.writeup p{color:#c4ced7;white-space:pre-wrap}.empty{border:1px dashed var(--line);padding:25px;color:var(--muted);margin-top:45px}.back{color:var(--accent)!important}</style></head><body><div class="nav"><div class="navin"><a class="back" href="index.html#work">← Back to Work</a><a href="index.html">KHALAD//SEC</a></div></div><main class="wrap" id="app">Loading…</main><script>const esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};const slug=s=>(s||'work').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');async function run(){let d;try{d=await(await fetch('./data.json?'+Date.now(),{cache:'no-store'})).json()}catch(e){app.innerHTML='<div class="empty">Could not load portfolio data.</div>';return}const id=new URLSearchParams(location.search).get('id');const groups=[['projects','Project'],['writeups','Write-up'],['labs','Lab'],['investigations','Investigation']];let found=null;for(const [kind,label] of groups){const item=(d[kind]||[]).find(x=>(x.id||slug(x.title))===id);if(item){found={item,kind,label};break}}if(!found){app.innerHTML='<div class="empty">This work item was not found. <a class="back" href="index.html#work">Return to portfolio →</a></div>';return}const x=found.item;document.title=`${x.title} — Khalad`;const write=x.writeup?`<div class="writeup"><span class="type">Full write-up</span><p>${esc(x.writeup)}</p></div>`:`<div class="empty">Detailed write-up coming soon.</div>`;app.innerHTML=`<span class="type">${esc(found.label)}${x.type?' · '+esc(x.type):''}</span><h1>${esc(x.title)}</h1><p class="lede">${esc(x.description||'')}</p><div class="meta">${x.year?`<span>${esc(x.year)}</span>`:''}</div><div class="tags">${(x.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>${write}`};run();</script></body></html>
