<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Homepage Manager — Khalad Portfolio</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="wrap">
  <div class="topnav"><a href="index.html">← Live site</a><a href="cases.html">Content</a><a href="profile.html" class="active">Homepage</a></div>
  <h1>Homepage Manager</h1>
  <p class="sub">Edit the homepage without touching HTML or JSON manually.</p>
  <div id="settingsContainer"></div>
  <div id="workArea" style="display:none">
    <div class="card"><h2>Hero</h2><label>Top label</label><input id="heroTag"><label>Main headline</label><textarea id="heroHeadline"></textarea><label>Intro</label><textarea id="heroLede"></textarea><label>Focus areas / pills (comma-separated)</label><input id="heroPills"></div>
    <div class="card"><h2>About</h2><label>Paragraphs (one paragraph per line)</label><textarea id="aboutParas" style="min-height:140px"></textarea><label>Certifications (one per line: CODE | Name)</label><textarea id="aboutCerts"></textarea></div>
    <div class="card"><h2>Skills & Tools</h2><label>Separate groups with a blank line. First line = group name.</label><textarea id="skillsBlock" style="min-height:240px;font-family:monospace"></textarea></div>
    <div class="card"><h2>Contact</h2><label>Contact text</label><textarea id="contactBlurb"></textarea><label>Links (one per line: Label | URL)</label><textarea id="contactLinks" placeholder="GitHub | https://github.com/...&#10;LinkedIn | https://linkedin.com/in/..."></textarea></div>
    <div class="card"><h2>Footer</h2><label>Name</label><input id="footerName"><label>Footer note</label><input id="footerNote"></div>
    <div class="row" style="margin-bottom:15px"><button class="primary" id="saveAll">Save homepage</button><button id="reloadBtn">Discard & reload</button></div><div id="saveStatus"></div>
  </div>
</div>
<script src="admin.js"></script>
<script>
let dataCache=null,sha=null;
const $=id=>document.getElementById(id);
function init(loaded){dataCache=loaded.content;sha=loaded.sha;$('workArea').style.display='block';fillForm()}
function fillForm(){const h=dataCache.hero||{},a=dataCache.about||{},s=dataCache.skills||[],c=dataCache.contact||{},f=dataCache.footer||{};$('heroTag').value=h.tag||'';$('heroHeadline').value=h.headline||'';$('heroLede').value=h.lede||'';$('heroPills').value=(h.pills||[]).join(', ');$('aboutParas').value=(a.paragraphs||[]).join('\n');$('aboutCerts').value=(a.certifications||[]).map(x=>`${x.code||''} | ${x.name||''}`).join('\n');$('skillsBlock').value=s.map(g=>[g.group,...(g.items||[])].join('\n')).join('\n\n');$('contactBlurb').value=c.blurb||'';$('contactLinks').value=(c.links||[]).map(x=>`${x.label||''} | ${x.url||''}`).join('\n');$('footerName').value=f.name||'';$('footerNote').value=f.note||''}
function lines(id){return $(id).value.split('\n').map(x=>x.trim()).filter(Boolean)}
function pipe(x){const i=x.indexOf('|');return i<0?[x,'']:[x.slice(0,i).trim(),x.slice(i+1).trim()]}
function skills(raw){return raw.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean).map(b=>{const x=b.split('\n').map(v=>v.trim()).filter(Boolean);return{group:x[0],items:x.slice(1)}})}
$('saveAll').onclick=async()=>{dataCache.hero={tag:$('heroTag').value.trim(),headline:$('heroHeadline').value.trim(),lede:$('heroLede').value.trim(),pills:$('heroPills').value.split(',').map(x=>x.trim()).filter(Boolean)};dataCache.about={paragraphs:lines('aboutParas'),certifications:lines('aboutCerts').map(x=>{const [code,name]=pipe(x);return{code,name}})};dataCache.skills=skills($('skillsBlock').value);dataCache.contact={blurb:$('contactBlurb').value.trim(),links:lines('contactLinks').map(x=>{const [label,url]=pipe(x);return{label,url}})};dataCache.footer={name:$('footerName').value.trim(),note:$('footerNote').value.trim()};$('saveStatus').innerHTML='<div class="status pending">Saving…</div>';try{const r=await writeDataFile(dataCache,sha,'Update homepage content');sha=r.content.sha;$('saveStatus').innerHTML='<div class="status ok">Saved. Refresh the live site to see the changes.</div>'}catch(e){$('saveStatus').innerHTML=`<div class="status err">${e.message}</div>`}}
$('reloadBtn').onclick=()=>location.reload();
renderSettingsPanel($('settingsContainer'),init);
</script></body></html>
